apply plugin: 'com.android.application'

def motmanKeystorePath = System.getenv('MOTMAN_KEYSTORE_PATH')
def motmanKeystorePassword = System.getenv('MOTMAN_KEYSTORE_PASSWORD')
def motmanKeyAlias = System.getenv('MOTMAN_KEY_ALIAS')
def motmanKeyPassword = System.getenv('MOTMAN_KEY_PASSWORD')
def motmanReleaseSigningReady = motmanKeystorePath && motmanKeystorePassword && motmanKeyAlias && motmanKeyPassword
def servicesJSON = file('google-services.json')
def firebaseReady = servicesJSON.exists() && servicesJSON.length() > 0

// UNE BUILD DE DEBOGAGE INSTALLABLE A COTE DE CELLE DU PLAY STORE.
//
// Le WebView n'accepte l'inspection a distance que dans une build DEBOGABLE :
// c'est le seul moyen de mesurer ce que voit vraiment un joueur Android, et son
// absence a coute trois tentatives a l'aveugle le 17/09/2026.
//
// L'identifiant ne prend le suffixe « .debug » que si google-services.json
// declare ce paquet : le greffon Google Services echoue sinon. Tant que le
// suffixe n'est pas declare dans Firebase, la build de debogage garde
// l'identifiant de production -- installable, mais seulement apres avoir
// desinstalle celle du Play Store (signatures differentes).
// `npm run apk:debug` derive une configuration Firebase pour le paquet de
// debogage dans src/debug/. Sans elle -- build lancee depuis Android Studio sans
// passer par le script --, on garde l'identifiant de production plutot que
// d'echouer : le greffon Google Services exige un client par identifiant.
def debugServicesJSON = file('src/debug/google-services.json')
def debugClientDeclared = !firebaseReady || debugServicesJSON.exists() || servicesJSON.text.contains('"com.motman.game.debug"')

android {
    namespace "com.motman.game"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.motman.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (motmanReleaseSigningReady) {
            release {
                storeFile file(motmanKeystorePath)
                storePassword motmanKeystorePassword
                keyAlias motmanKeyAlias
                keyPassword motmanKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Capacitor active `setWebContentsDebuggingEnabled` des que l'appli
            // est debogable : rien d'autre a poser ici.
            if (debugClientDeclared) {
                applicationIdSuffix '.debug'
                versionNameSuffix '-debug'
            }
        }
        release {
            minifyEnabled false
            if (motmanReleaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    if (firebaseReady) {
        implementation platform('com.google.firebase:firebase-bom:34.15.0')
        implementation 'com.google.firebase:firebase-crashlytics'
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    if (firebaseReady) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, Firebase plugins not applied. Push Notifications and Crashlytics won't work")
}
