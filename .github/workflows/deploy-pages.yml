name: Verify and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Les solutions ne vivent plus dans ce dépôt public : l'atelier privé les
      # suit (scripts/atelier.mjs). Sans secret, ce contrôle échoue dès qu'un
      # fichier suivi tombe sous un motif ignoré — la forme que prendrait une
      # fuite. Sa seconde moitié, qui cherche les mots du vrai catalogue dans
      # les fichiers suivis, tourne plus bas, une fois ce catalogue tiré.
      - name: Solutions stay out of the public repository
        run: npm run check:atelier

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check static Google Play configuration
        run: npm run audit:play -- --static

      - name: Check deployment configuration
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Les variables VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY sont obligatoires pour publier MotMan."
            exit 1
          fi
          if [[ -z "$VITE_TURNSTILE_SITE_KEY" ]]; then
            echo "::warning::VITE_TURNSTILE_SITE_KEY est absent : Turnstile restera inactif jusqu’à sa configuration."
          fi
          if [[ ! "$VITE_SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "::error::VITE_SUPABASE_URL n'est pas une URL de projet Supabase valide."
            exit 1
          fi

      # `tsc -b` (dans `npm run build`) ne couvre QUE le client et `server/**` :
      # `tsconfig.server.json` n'inclut pas `supabase/functions/`. Tout le code
      # serveur — celui qui verse les plumes, applique le classé et clôt les
      # parties — partait donc en production sans qu'aucun compilateur ne l'ait
      # lu. Au premier passage, `deno check` a sorti 184 erreurs.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        run: npm run check:functions

      # `awardFinished` décide qui est payé, combien, et sous quelle clé
      # d'idempotence. Elle n'avait aucun test : elle vivait sous le `Deno.serve`
      # d'`index.ts`, donc impossible à importer sans démarrer un serveur. Sortie
      # dans `match-api/awards.ts` — sans une ligne réécrite — pour être couverte.
      - name: Unit-test edge functions
        run: npm run test:functions

      - name: Unit tests
        run: npm run test:unit

      # Trois règles du jeu sont écrites DEUX FOIS, faute de pouvoir importer du
      # TypeScript dans plpgsql : la série du défi du jour, la courbe d'XP et les
      # paliers de classe. Les tests unitaires ci-dessus ne couvrent que la
      # moitié TypeScript de chacune.
      #
      # Cette étape pose les mêmes questions à PostgreSQL, à partir des mêmes
      # fichiers de cas (src/data/). Elle existe parce que la première version
      # SQL de la série prétendait recopier `advanceStreak` et avait omis la
      # fenêtre de récupération entière : un joueur remonté à 30 jours par le pont
      # voyait « palier atteint » sans jamais être payé. Une relecture attentive
      # n'avait pas suffi.
      #
      # `--migration` charge d'abord les migrations DU DÉPÔT que la base n'a pas
      # encore enregistrées, puis annule tout : une divergence est attrapée AVANT
      # la livraison, et la base n'en garde aucune trace.
      #
      # L'étape se saute d'elle-même sans le secret (fork, dépôt cloné) plutôt
      # que d'échouer sur une absence de configuration.
      - name: Cross-language game rules agree
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm run test:rules -- --migration

      # Trois suites SQL — matchmaking atomique, confirmation classée, archivage
      # de l'historique — dormaient dans `supabase/tests/` depuis leur écriture :
      # 519 lignes que RIEN n'exécutait. Elles couvrent les RPC dont tout
      # l'intérêt est le comportement sous concurrence, celui qu'une relecture ne
      # permet pas de vérifier.
      #
      # Chaque fichier ouvre sa transaction et l'annule ; le script refuse
      # d'envoyer un fichier dont ce n'est pas le cas.
      #
      # `--migration` comme pour l'étape précédente : ce qu'on valide est l'état
      # DU DÉPÔT, migrations non encore livrées comprises. Sans ce drapeau, une
      # suite qui teste un correctif de RPC échouerait jusqu'au déploiement.
      - name: SQL suites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm run test:sql -- --migration

      - name: Validate the 7x8 catalog
        run: npm run test:dimensions

      - name: Build and audit private data
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Check runtime budgets
        run: npm run test:performance

      - name: Audit the GitHub Pages artifact
        run: npm run audit:pages

      # Tout ce qui précède tourne sur la FIXTURE (tests/fixtures/) : huit
      # grilles déjà publiques dans l'historique. Le vrai catalogue, AVEC les
      # solutions, est tiré de la base vers un dossier temporaire du runner :
      #   - jamais dans le dépôt ni dans `dist` — le build est déjà fait ;
      #   - jamais dans un artefact — Playwright, plus bas, tourne lui aussi sur
      #     la fixture : ses traces d'échec ne montrent que des grilles brûlées ;
      #   - jamais dans le journal, public ici : le script n'y écrit que des
      #     comptes.
      - name: Pull the production catalog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/pull_runtime_catalog.mjs --out "$RUNNER_TEMP/motman-catalogue/runtime.grid.catalog.json"

      # Les contrôles qui n'ont de sens que sur les vraies grilles : le
      # calendrier pointe des gridId absents de la fixture. Sur une PR sans
      # secret (fork), ils se sautent. Sur main, ils ne le peuvent pas :
      # MOTMAN_CATALOGUE_REQUIS fait échouer celui qui ne trouverait que la
      # fixture, et un tirage manqué laisse MOTMAN_CATALOGUE_RUNTIME pointer
      # vers un fichier absent, ce qui échoue aussi.
      - name: Checks against the production catalog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MOTMAN_CATALOGUE_RUNTIME: ${{ runner.temp }}/motman-catalogue/runtime.grid.catalog.json
          MOTMAN_CATALOGUE_REQUIS: '1'
        if: (github.event_name != 'pull_request' && github.repository == 'Doctox/motman') || env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npm run check:daily
          npm run test:dimensions
          npx vitest run src/dailyCalendar.test.ts
          npm run audit:security
          npm run test:performance
          npm run check:atelier

      - name: Remove the production catalog
        if: always()
        run: rm -rf "$RUNNER_TEMP/motman-catalogue"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Complete-game tests on Chromium and WebKit
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            output/playwright/results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment checks
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the published site
        run: npm run smoke:deployment
        env:
          MOTMAN_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
